<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Smooth TTS</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1a1a2e">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #eee; padding: 72px 16px 16px; min-height: 100vh; }
  h1 { font-size: 1.3rem; margin-bottom: 12px; color: #e8b64c; }
  textarea { width: 100%; height: 32vh; background: #16213e; color: #eee; border: 1px solid #0f3460; border-radius: 8px; padding: 12px; font-size: 1rem; resize: vertical; }
  textarea:focus { outline: none; border-color: #e8b64c; }
  .row { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; align-items: center; }
  select, input[type="range"] { background: #16213e; color: #eee; border: 1px solid #0f3460; border-radius: 6px; padding: 8px; }
  select { flex: 1; min-width: 180px; font-size: 0.95rem; }
  button { background: #0f3460; color: #eee; border: none; border-radius: 8px; padding: 12px 18px; font-size: 1rem; cursor: pointer; }
  button:active { transform: scale(0.97); }
  button.primary { background: #e8b64c; color: #1a1a2e; font-weight: bold; flex: 1; }
  button:disabled { opacity: 0.4; }
  .controls { display: flex; gap: 8px; margin: 12px 0; }
  .controls button { flex: 1; font-size: 1.2rem; }
  label { font-size: 0.85rem; color: #aaa; display: flex; align-items: center; gap: 6px; }
  #progress { height: 6px; background: #16213e; border-radius: 3px; margin: 12px 0; overflow: hidden; }
  #progressBar { height: 100%; background: #e8b64c; width: 0%; transition: width 0.3s; }
  #status { font-size: 0.85rem; color: #888; margin-top: 8px; min-height: 1.2em; }
  #chunkInfo { font-size: 0.8rem; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<h1>🔊 Smooth TTS</h1>
<textarea id="textInput" placeholder="Paste or type text here..."></textarea>

<div class="row">
  <select id="voiceSelect"><option>Loading voices...</option></select>
</div>

<div class="row">
  <label>Speed <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1"></label>
  <label>Pitch <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1"></label>
</div>

<div class="controls">
  <button id="prevBtn" title="Previous chunk">⏮</button>
  <button id="playBtn" class="primary" title="Play/Pause">▶</button>
  <button id="stopBtn" title="Stop">⏹</button>
  <button id="nextBtn" title="Next chunk">⏭</button>
</div>

<div class="row">
  <button id="clearBtn" style="flex:1">Clear</button>
  <button id="pasteBtn" style="flex:1">📋 Paste</button>
</div>

<div id="progress"><div id="progressBar"></div></div>
<div id="status"></div>
<div id="chunkInfo"></div>

<script>
const synth = window.speechSynthesis;
let voices = [];
let chunks = [];
let currentChunk = 0;
let isPlaying = false;
let currentUtterance = null;

/* ---------- Text preprocessing ---------- */
function cleanText(text) {
  return text
    .replace(/\r\n/g, '\n')
    // strip SSML tags entirely — never read markup aloud
    .replace(/<\s*\/?\s*(speak|break|prosody|emphasis|say-as|sub|phoneme|voice|lang|mark|audio|desc|p|s)[^>]*>/gi, '')
    // strip markdown that TTS mangles
    .replace(/\*\*/g, '')               // bold markers
    .replace(/\*/g, '')                 // asterisks — never say "asterisk"
    .replace(/#{1,6}\s/g, '')           // headers
    .replace(/`{1,3}/g, '')             // code ticks
    .replace(/_{1,2}(\S[^_]*\S)_{1,2}/g, '$1')  // italic/bold underscores
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')    // links -> text only
    .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1')   // images -> alt text
    .replace(/^\s*[-*+]\s+/gm, '')      // list bullets
    .replace(/^\s*\d+\.\s+/gm, '')      // numbered lists
    .replace(/^\s*>\s?/gm, '')          // blockquotes
    .replace(/[ \t]+/g, ' ')           // collapse whitespace
    .replace(/\n{3,}/g, '\n\n')         // collapse blank lines
    // expand common abbreviations
    .replace(/\bDr\./g, 'Doctor')
    .replace(/\bMr\./g, 'Mister')
    .replace(/\bMrs\./g, 'Misses')
    .replace(/\bMs\./g, 'Miss')
    .replace(/\bSt\./g, 'Saint')
    .replace(/\betc\./g, 'etcetera')
    .replace(/\be\.g\./g, 'for example')
    .replace(/\bi\.e\./g, 'that is')
    .replace(/\bvs\./g, 'versus')
    .trim();
}

/* Split into sentence-aware chunks — never mid-sentence */
function chunkText(text, maxLen = 400) {
  const cleaned = cleanText(text);
  if (!cleaned) return [];
  // Split on sentence boundaries, keeping the delimiter
  const sentences = cleaned.match(/[^.!?]+[.!?]+["']?|\n\n|[^.!?]+$/g) || [cleaned];
  const result = [];
  let current = '';
  for (const s of sentences) {
    const trimmed = s.trim();
    if (!trimmed) continue;
    if ((current + ' ' + trimmed).length > maxLen && current) {
      result.push(current.trim());
      current = trimmed;
    } else {
      current = current ? current + ' ' + trimmed : trimmed;
    }
  }
  if (current.trim()) result.push(current.trim());
  return result;
}

/* ---------- Voice loading ---------- */
function loadVoices() {
  voices = synth.getVoices();
  // Prefer English voices, dedup by name
  const seen = new Set();
  const english = voices.filter(v => {
    if (seen.has(v.name)) return false;
    seen.add(v.name);
    return v.lang && v.lang.toLowerCase().startsWith('en');
  });
  const list = english.length ? english : voices;
  const sel = document.getElementById('voiceSelect');
  sel.innerHTML = '';
  // System Default first
  const defOpt = document.createElement('option');
  defOpt.value = '-1'; defOpt.textContent = 'System Default';
  sel.appendChild(defOpt);
  list.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = voices.indexOf(v);
    o.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(o);
  });
  setStatus(`${list.length} voices available`);
}
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
loadVoices();

/* ---------- Playback ---------- */
function getSelectedVoice() {
  const idx = document.getElementById('voiceSelect').value;
  if (idx === '-1' || idx === '') return null; // system default
  return voices[parseInt(idx)] || null;
}

function speakChunk(index) {
  if (index < 0 || index >= chunks.length) { stop(); return; }
  currentChunk = index;
  synth.cancel(); // clear queue for clean chunk switch

  const u = new SpeechSynthesisUtterance(chunks[index]);
  const voice = getSelectedVoice();
  if (voice) u.voice = voice;
  u.rate = parseFloat(document.getElementById('rateSlider').value);
  u.pitch = parseFloat(document.getElementById('pitchSlider').value);
  u.volume = 1;
  // Consistent settings across ALL chunks = no seams from voice switching

  u.onend = () => {
    if (!isPlaying) return;
    if (currentChunk < chunks.length - 1) {
      speakChunk(currentChunk + 1); // chain to next — minimal gap
    } else {
      stop();
      setStatus('Done.');
    }
  };
  u.onerror = (e) => {
    if (e.error !== 'interrupted' && e.error !== 'canceled') {
      setStatus('Error: ' + e.error);
    }
  };

  currentUtterance = u;
  updateProgress();
  setStatus(`Speaking chunk ${index + 1} of ${chunks.length}`);
  synth.speak(u);
}

function play() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) { setStatus('Enter some text first.'); return; }
  if (isPlaying) { pause(); return; }

  // (Re)chunk only if text changed or starting fresh
  const newChunks = chunkText(text);
  if (JSON.stringify(newChunks) !== JSON.stringify(chunks)) {
    chunks = newChunks;
    currentChunk = 0;
  }
  if (!chunks.length) { setStatus('No text to speak.'); return; }

  isPlaying = true;
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('chunkInfo').textContent =
    `${chunks.length} chunk${chunks.length > 1 ? 's' : ''} (sentence-aware, no mid-sentence cuts)`;
  speakChunk(currentChunk);
}

function pause() {
  isPlaying = false;
  synth.cancel();
  document.getElementById('playBtn').textContent = '▶';
  setStatus('Paused.');
}

function stop() {
  isPlaying = false;
  synth.cancel();
  currentChunk = 0;
  document.getElementById('playBtn').textContent = '▶';
  updateProgress();
  setStatus('Stopped.');
}

function skipTo(index) {
  if (!chunks.length) { play(); return; }
  const wasPlaying = isPlaying;
  isPlaying = true;
  document.getElementById('playBtn').textContent = '⏸';
  speakChunk(Math.max(0, Math.min(index, chunks.length - 1)));
  if (!wasPlaying) { /* keep playing from new position */ }
}

/* ---------- UI ---------- */
function updateProgress() {
  const pct = chunks.length ? (currentChunk / chunks.length) * 100 : 0;
  document.getElementById('progressBar').style.width = pct + '%';
}
function setStatus(s) { document.getElementById('status').textContent = s; }

document.getElementById('playBtn').onclick = play;
document.getElementById('stopBtn').onclick = stop;
document.getElementById('prevBtn').onclick = () => skipTo(currentChunk - 1);
document.getElementById('nextBtn').onclick = () => skipTo(currentChunk + 1);
document.getElementById('clearBtn').onclick = () => {
  document.getElementById('textInput').value = '';
  stop(); chunks = [];
  document.getElementById('chunkInfo').textContent = '';
};
document.getElementById('pasteBtn').onclick = async () => {
  const ta = document.getElementById('textInput');
  try {
    const t = await navigator.clipboard.readText();
    if(t){ ta.value = t; setStatus('Pasted.'); return; }
  } catch(e) {}
  // Clipboard API blocked — focus the box so keyboard/long-press paste works
  ta.focus();
  ta.select();
  setStatus('Tap paste on your keyboard.');
};

// Chrome workaround: resume suspended synthesis
setInterval(() => { if (isPlaying && synth.paused) synth.resume(); }, 1000);
</script>
</body>
</html>
